<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GK PRONO — Analyse Football</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#050b14;
    color:#fff;
}

header{
    padding:20px 16px;
    text-align:center;
    background:linear-gradient(135deg,#071d35,#0b3155);
    border-bottom:1px solid #1d527d;
}

.logo{
    font-size:32px;
    font-weight:900;
    letter-spacing:2px;
    color:#38bdf8;
}

.subtitle{
    margin-top:6px;
    color:#9fb5c8;
    font-size:13px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:18px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    background:#0b1726;
    border:1px solid #193953;
    padding:12px;
    border-radius:12px;
    margin-bottom:20px;
}

.badge{
    color:#22c55e;
    font-size:13px;
    font-weight:bold;
}

button{
    border:0;
    cursor:pointer;
    font-weight:bold;
}

.refresh{
    background:#1683c5;
    color:white;
    padding:10px 14px;
    border-radius:8px;
}

.title{
    font-size:22px;
    margin:22px 0 12px;
}

.matches{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:15px;
}

.match-card{
    background:#0b1726;
    border:1px solid #193953;
    border-radius:15px;
    padding:16px;
}

.league{
    font-size:12px;
    color:#7da1bb;
    margin-bottom:10px;
}

.teams{
    text-align:center;
    font-size:17px;
    font-weight:800;
    line-height:1.5;
}

.vs{
    color:#55738b;
    font-size:12px;
}

.match-date{
    text-align:center;
    color:#718ca2;
    font-size:12px;
    margin:12px 0;
}

.analyse-btn{
    width:100%;
    padding:12px;
    background:#1683c5;
    color:#fff;
    border-radius:8px;
}

.analysis{
    display:none;
    margin-top:20px;
}

.hero{
    background:linear-gradient(145deg,#0b233b,#071522);
    border:1px solid #24577d;
    border-radius:18px;
    padding:20px;
    text-align:center;
}

.hero-teams{
    font-size:23px;
    font-weight:900;
    line-height:1.6;
}

.hero-vs{
    color:#38bdf8;
    font-size:13px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:14px;
    margin-top:15px;
}

.box{
    background:#0b1726;
    border:1px solid #193953;
    border-radius:14px;
    padding:16px;
}

.box h3{
    color:#38bdf8;
    font-size:15px;
    margin-bottom:14px;
}

.prob{
    margin-bottom:13px;
}

.prob-top{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    margin-bottom:6px;
}

.bar{
    height:8px;
    background:#172b3d;
    border-radius:20px;
    overflow:hidden;
}

.fill{
    height:100%;
    background:#1683c5;
    border-radius:20px;
}

.big-score{
    font-size:38px;
    font-weight:900;
    color:#facc15;
    text-align:center;
    padding:12px 0;
}

.metric{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid #142d42;
    font-size:13px;
}

.metric:last-child{
    border-bottom:0;
}

.metric span:first-child{
    color:#8fa8ba;
}

.metric strong{
    color:#fff;
}

.recommendation{
    margin-top:15px;
    padding:16px;
    border-radius:13px;
    background:linear-gradient(135deg,#102f28,#0b211d);
    border:1px solid #236c50;
}

.recommendation h3{
    color:#22c55e;
    margin-bottom:8px;
}

.recommendation p{
    color:#b8cbc5;
    font-size:13px;
    line-height:1.6;
}

.h2h-match{
    padding:9px 0;
    border-bottom:1px solid #142d42;
    font-size:12px;
    color:#a9bac8;
}

.odds{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.odd{
    background:#101f30;
    padding:11px;
    border-radius:8px;
    text-align:center;
}

.odd small{
    display:block;
    color:#7892a6;
    margin-bottom:5px;
}

.odd strong{
    color:#38bdf8;
}

.loading{
    padding:25px;
    text-align:center;
    color:#8199ad;
}

.error{
    padding:15px;
    background:#32151a;
    border:1px solid #752936;
    color:#ff9ca8;
    border-radius:10px;
}

footer{
    text-align:center;
    color:#627b90;
    font-size:12px;
    padding:30px 15px;
}
</style>
</head>

<body>

<header>
    <div class="logo">GK PRONO</div>
    <div class="subtitle">
        Intelligence football • Analyse des probabilités
    </div>
</header>

<div class="container">

    <div class="topbar">
        <span class="badge">● BSD CONNECTÉ</span>
        <button class="refresh" onclick="loadMatches()">Actualiser</button>
    </div>

    <h2 class="title">⚽ Matchs disponibles</h2>

    <div id="matches" class="matches">
        <div class="loading">Chargement...</div>
    </div>

</div>

<footer>
    GK PRONO © 2026
</footer>

<script>

async function api(url){

    const r=await fetch(url);
    const text=await r.text();

    let data;

    try{
        data=JSON.parse(text);
    }catch{
        throw new Error("Réponse serveur invalide");
    }

    if(!r.ok){
        throw new Error(data.message || "Erreur serveur");
    }

    return data;
}

function esc(v){

    return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function percent(v){

    return Number.isFinite(Number(v))
        ? Number(v).toFixed(1)+"%"
        : "—";

}

function dateFormat(v){

    if(!v)return "Date inconnue";

    try{
        return new Intl.DateTimeFormat("fr-FR",{
            dateStyle:"medium",
            timeStyle:"short"
        }).format(new Date(v));
    }catch{
        return v;
    }

}

async function loadMatches(){

    const box=document.getElementById("matches");

    box.innerHTML=
        `<div class="loading">Chargement des matchs...</div>`;

    try{

        const data=await api("/api/matches");

        const matches=data.matches || [];

        if(!matches.length){

            box.innerHTML=
                `<div class="loading">
                    Aucun match disponible.
                </div>`;

            return;
        }

        box.innerHTML=matches.map(m=>`

            <div class="match-card">

                <div class="league">
                    ⚽ ${esc(m.league_name || "Football")}
                </div>

                <div class="teams">
                    ${esc(m.home_team)}
                    <div class="vs">VS</div>
                    ${esc(m.away_team)}
                </div>

                <div class="match-date">
                    ${esc(dateFormat(m.event_date))}
                </div>

                <button
                    class="analyse-btn"
                    onclick="analyse(${Number(m.id)},this)"
                >
                    🔎 ANALYSER
                </button>

                <div
                    class="analysis"
                    id="a-${Number(m.id)}"
                ></div>

            </div>

        `).join("");

    }catch(e){

        box.innerHTML=
            `<div class="error">❌ ${esc(e.message)}</div>`;

    }

}

function metric(label,value){

    return `
        <div class="metric">
            <span>${esc(label)}</span>
            <strong>${esc(value)}</strong>
        </div>
    `;

}

function probability(label,value){

    const n=Number(value);

    if(!Number.isFinite(n))return "";

    return `
        <div class="prob">

            <div class="prob-top">
                <span>${esc(label)}</span>
                <strong>${n.toFixed(1)}%</strong>
            </div>

            <div class="bar">
                <div
                    class="fill"
                    style="width:${Math.max(0,Math.min(100,n))}%"
                ></div>
            </div>

        </div>
    `;

}

async function analyse(id,button){

    const box=document.getElementById("a-"+id);

    if(box.style.display==="block"){

        box.style.display="none";
        return;

    }

    box.style.display="block";

    box.innerHTML=
        `<div class="loading">
            🧠 Analyse des données BSD...
        </div>`;

    button.disabled=true;

    try{

        const data=await api("/api/analyse/"+id);

        const event=data.event || {};
        const p=data.prediction || {};
        const markets=p.markets || {};
        const result=markets.match_result || {};
        const goals=markets.expected_goals || {};
        const over=markets.over_under || {};
        const btts=markets.btts || {};
        const score=markets.score || {};
        const model=p.model || {};
        const rec=p.recommendations || {};
        const h2h=data.h2h || {};
        const odds=data.odds?.odds || {};

        let h2hHtml="";

        if(h2h.recent_matches?.length){

            h2hHtml=h2h.recent_matches.map(m=>`

                <div class="h2h-match">
                    ${esc(m.home)}
                    ${esc(m.score)}
                    ${esc(m.away)}
                </div>

            `).join("");

        }else{

            h2hHtml="<div class='loading'>Pas d'historique disponible.</div>";

        }

        const confidence=
            model.confidence != null
            ? Number(model.confidence)*100
            : null;

        let recommendation="Analyse en cours...";

        if(rec.bet_favorite===true){
            recommendation=
                "Le modèle considère le favori comme suffisamment intéressant.";
        }else if(
            result.predicted &&
            result.prob_home >= 65
        ){
            recommendation=
                "Le domicile possède une forte probabilité, mais le modèle ne valide pas automatiquement le pari sur le favori.";
        }else if(
            result.predicted &&
            result.prob_away >= 65
        ){
            recommendation=
                "L'extérieur possède une forte probabilité selon le modèle.";
        }else{
            recommendation=
                "Les probabilités sont trop équilibrées pour considérer cette sélection comme forte.";
        }

        box.innerHTML=`

            <div class="hero">

                <div class="hero-teams">
                    ${esc(event.home_team)}
                    <div class="hero-vs">VS</div>
                    ${esc(event.away_team)}
                </div>

                <div style="margin-top:10px;color:#7894aa;font-size:12px">
                    ${esc(dateFormat(event.event_date))}
                </div>

            </div>

            <div class="grid">

                <div class="box">

                    <h3>📊 Résultat 1X2</h3>

                    ${probability(
                        "Domicile",
                        result.prob_home
                    )}

                    ${probability(
                        "Nul",
                        result.prob_draw
                    )}

                    ${probability(
                        "Extérieur",
                        result.prob_away
                    )}

                    ${metric(
                        "Prévision du modèle",
                        result.predicted || "—"
                    )}

                </div>

                <div class="box">

                    <h3>🎯 Score & buts</h3>

                    <div class="big-score">
                        ${esc(score.most_likely || "—")}
                    </div>

                    ${metric(
                        "Buts attendus domicile",
                        goals.home ?? "—"
                    )}

                    ${metric(
                        "Buts attendus extérieur",
                        goals.away ?? "—"
                    )}

                </div>

                <div class="box">

                    <h3>🔥 Marchés buts</h3>

                    ${metric(
                        "Over 1.5",
                        percent(over.prob_over_15)
                    )}

                    ${metric(
                        "Over 2.5",
                        percent(over.prob_over_25)
                    )}

                    ${metric(
                        "Over 3.5",
                        percent(over.prob_over_35)
                    )}

                    ${metric(
                        "BTTS",
                        percent(btts.prob_yes)
                    )}

                </div>

                <div class="box">

                    <h3>💰 Cotes</h3>

                    <div class="odds">

                        <div class="odd">
                            <small>1</small>
                            <strong>${odds.home_win ?? "—"}</strong>
                        </div>

                        <div class="odd">
                            <small>X</small>
                            <strong>${odds.draw ?? "—"}</strong>
                        </div>

                        <div class="odd">
                            <small>2</small>
                            <strong>${odds.away_win ?? "—"}</strong>
                        </div>

                    </div>

                    ${metric(
                        "Over 1.5",
                        odds.over_15_goals ?? "—"
                    )}

                    ${metric(
                        "Over 2.5",
                        odds.over_25_goals ?? "—"
                    )}

                    ${metric(
                        "BTTS Oui",
                        odds.btts_yes ?? "—"
                    )}

                </div>

                <div class="box">

                    <h3>🆚 Historique H2H</h3>

                    ${metric(
                        "Matchs",
                        h2h.total_matches ?? "—"
                    )}

                    ${metric(
                        "Victoires domicile",
                        h2h.home_wins ?? "—"
                    )}

                    ${metric(
                        "Nuls",
                        h2h.draws ?? "—"
                    )}

                    ${metric(
                        "Victoires extérieur",
                        h2h.away_wins ?? "—"
                    )}

                    ${metric(
                        "Moyenne buts",
                        h2h.avg_total_goals ?? "—"
                    )}

                    ${h2hHtml}

                </div>

                <div class="box">

                    <h3>🧠 Modèle GK PRONO</h3>

                    ${metric(
                        "Confiance BSD",
                        confidence != null
                        ? confidence.toFixed(2)+"%"
                        : "—"
                    )}

                    ${metric(
                        "Version",
                        model.version || "—"
                    )}

                    ${metric(
                        "Favori",
                        rec.favorite || result.predicted || "—"
                    )}

                    ${metric(
                        "Probabilité favori",
                        rec.favorite_prob != null
                        ? percent(rec.favorite_prob)
                        : "—"
                    )}

                </div>

            </div>

            <div class="recommendation">

                <h3>💡 Lecture de l'analyse</h3>

                <p>
                    ${esc(recommendation)}
                </p>

            </div>

        `;

    }catch(e){

        box.innerHTML=
            `<div class="error">
                ❌ ${esc(e.message)}
            </div>`;

    }finally{

        button.disabled=false;

    }

}

loadMatches();

</script>

</body>
    </html>
