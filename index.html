<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GK PRONO</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#07111f;
    color:white;
}

header{
    background:linear-gradient(135deg,#0b1f38,#102f55);
    padding:25px 15px;
    text-align:center;
    border-bottom:1px solid #21466d;
}

.logo{
    font-size:30px;
    font-weight:900;
    letter-spacing:2px;
}

.subtitle{
    color:#9db6d0;
    margin-top:7px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px 15px;
}

.status{
    background:#0d1d30;
    border:1px solid #1c3b5c;
    padding:14px;
    border-radius:12px;
    margin-bottom:20px;
    text-align:center;
}

.matches{
    display:grid;
    gap:15px;
}

.match{
    background:#0d1d30;
    border:1px solid #1c3b5c;
    border-radius:16px;
    padding:18px;
}

.teams{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    text-align:center;
}

.team{
    width:40%;
    font-size:17px;
    font-weight:bold;
}

.vs{
    color:#6f8da9;
    font-weight:bold;
}

.time{
    text-align:center;
    margin-top:15px;
    color:#58a6ff;
    font-weight:bold;
}

.analyse{
    width:100%;
    margin-top:15px;
    padding:12px;
    border:0;
    border-radius:10px;
    background:#1877f2;
    color:white;
    font-size:15px;
    font-weight:bold;
}

.loading{
    text-align:center;
    padding:30px;
    color:#9db6d0;
}

.error{
    background:#3a1414;
    border:1px solid #7b2929;
    padding:15px;
    border-radius:10px;
    color:#ffb3b3;
}
</style>
</head>

<body>

<header>
    <div class="logo">⚡ GK PRONO</div>
    <div class="subtitle">
        Analyse intelligente des matchs ⚽
    </div>
</header>

<div class="container">

    <div class="status" id="status">
        🔄 Chargement des matchs...
    </div>

    <div id="matches" class="matches">
        <div class="loading">
            Récupération des matchs...
        </div>
    </div>

</div>

<script>

async function chargerMatchs(){

    const status = document.getElementById("status");
    const container = document.getElementById("matches");

    try{

        const response = await fetch("/api/matches");

        const data = await response.json();

        if(!data.success){
            throw new Error(
                data.message || "Erreur API"
            );
        }

        status.innerHTML =
            "🟢 " +
            data.nombre_matchs +
            " matchs trouvés aujourd'hui";

        container.innerHTML = "";

        if(!data.matches ||
           data.matches.length === 0){

            container.innerHTML = `
                <div class="loading">
                    Aucun match disponible aujourd'hui.
                </div>
            `;

            return;
        }

        data.matches.forEach(match => {

            const equipe =
                match.name.split(" vs ");

            let heure = "";

            if(match.starting_at){

                const date = new Date(
                    match.starting_at.replace(
                        " ",
                        "T"
                    )
                );

                heure = date.toLocaleTimeString(
                    "fr-FR",
                    {
                        hour:"2-digit",
                        minute:"2-digit"
                    }
                );
            }

            const card =
                document.createElement("div");

            card.className = "match";

            card.innerHTML = `

                <div class="teams">

                    <div class="team">
                        ${equipe[0] || ""}
                    </div>

                    <div class="vs">
                        VS
                    </div>

                    <div class="team">
                        ${equipe[1] || ""}
                    </div>

                </div>

                <div class="time">
                    🕐 ${heure}
                </div>

                <button
                    class="analyse"
                    onclick="analyser('${match.name}')"
                >
                    🤖 ANALYSER
                </button>

            `;

            container.appendChild(card);

        });

    }catch(error){

        status.innerHTML =
            "🔴 Impossible de charger les matchs";

        container.innerHTML = `
            <div class="error">
                ❌ ${error.message}
            </div>
        `;

    }

}

function analyser(match){

    alert(
        "🤖 Analyse de :\n\n" +
        match +
        "\n\nLe moteur d'analyse sera ajouté ensuite."
    );

}

chargerMatchs();

</script>

</body>
  </html>
