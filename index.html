<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GK PRONO V1</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#07111f;
  color:#fff;
}
header{
  padding:22px 16px;
  text-align:center;
  background:linear-gradient(135deg,#0d1b31,#10294a);
  border-bottom:1px solid #263a55;
}
.logo{font-size:28px;font-weight:900;letter-spacing:1px}
.subtitle{margin-top:7px;color:#9fb0c8;font-size:13px}
.controls{
  padding:14px;
  display:flex;
  gap:8px;
  position:sticky;
  top:0;
  z-index:5;
  background:#07111f;
  border-bottom:1px solid #1d2d42;
}
input,button{
  border:0;
  border-radius:10px;
  padding:12px;
  font-size:14px;
}
input{flex:1;background:#111f32;color:white;border:1px solid #2b405c}
button{
  background:#18a66a;
  color:white;
  font-weight:800;
  cursor:pointer;
}
button:disabled{opacity:.6}
.info{padding:12px 14px;color:#aebbd0;font-size:13px}
#matches{padding:0 12px 30px}
.card{
  background:#0e1b2d;
  border:1px solid #213650;
  border-radius:15px;
  margin:10px 0;
  padding:14px;
}
.league{
  color:#8fa5c2;
  font-size:12px;
  margin-bottom:12px;
}
.teams{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:8px;
}
.team{text-align:center;font-weight:800;font-size:14px}
.team img{width:38px;height:38px;object-fit:contain;display:block;margin:0 auto 7px}
.vs{text-align:center;color:#7f91a9;font-weight:900}
.meta{text-align:center;color:#9fb0c8;font-size:12px;margin-top:12px}
.analyse{
  width:100%;
  margin-top:12px;
  background:#162a45;
}
.empty,.error{
  margin:20px 0;
  padding:18px;
  border-radius:12px;
  background:#0e1b2d;
  color:#aebbd0;
  text-align:center;
}
.error{color:#ff9b9b;border:1px solid #6b3030}
</style>
</head>
<body>

<header>
  <div class="logo">⚽ GK PRONO</div>
  <div class="subtitle">Matchs du jour • Données automatiques</div>
</header>

<div class="controls">
  <input id="date" type="date">
  <button id="load">CHARGER</button>
</div>

<div class="info" id="info">Préparation...</div>
<div id="matches"></div>

<script>
const dateInput = document.getElementById("date");
const loadBtn = document.getElementById("load");
const info = document.getElementById("info");
const matchesBox = document.getElementById("matches");

function today(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

dateInput.value = today();

function formatTime(iso){
  if(!iso) return "--:--";
  return new Date(iso).toLocaleTimeString("fr-FR", {
    hour:"2-digit", minute:"2-digit"
  });
}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function render(matches){
  if(!matches.length){
    matchesBox.innerHTML = `<div class="empty">Aucun match trouvé pour cette date.</div>`;
    info.textContent = "0 match";
    return;
  }

  info.textContent = `${matches.length} match(s) récupéré(s) automatiquement`;

  matchesBox.innerHTML = matches.map(m => `
    <div class="card">
      <div class="league">
        ${escapeHtml(m.league?.country || "")} • ${escapeHtml(m.league?.name || "Compétition")}
      </div>

      <div class="teams">
        <div class="team">
          <img src="${escapeHtml(m.home?.logo || "")}" alt="">
          ${escapeHtml(m.home?.name || "Domicile")}
        </div>

        <div class="vs">VS</div>

        <div class="team">
          <img src="${escapeHtml(m.away?.logo || "")}" alt="">
          ${escapeHtml(m.away?.name || "Extérieur")}
        </div>
      </div>

      <div class="meta">
        🕐 ${formatTime(m.date)} • ${escapeHtml(m.statusLong || "Programmé")}
      </div>

      <button class="analyse" onclick="analyse(${Number(m.id)})">
        🔎 ANALYSER
      </button>
    </div>
  `).join("");
}

async function loadMatches(){
  loadBtn.disabled = true;
  loadBtn.textContent = "CHARGEMENT...";
  matchesBox.innerHTML = "";
  info.textContent = "Connexion à notre serveur...";

  try{
    const date = dateInput.value || today();
    const response = await fetch(`/api/fixtures?date=${encodeURIComponent(date)}`);
    const data = await response.json();

    if(!response.ok || !data.success){
      throw new Error(
        typeof data.error === "string"
          ? data.error
          : JSON.stringify(data.error || "Erreur inconnue")
      );
    }

    render(data.matches || []);
  }catch(error){
    info.textContent = "Erreur";
    matchesBox.innerHTML = `
      <div class="error">
        ❌ ${escapeHtml(error.message)}
      </div>`;
  }finally{
    loadBtn.disabled = false;
    loadBtn.textContent = "CHARGER";
  }
}

function analyse(id){
  alert(
    "Analyse V1 : le match #" + id +
    "\\n\\nLe moteur de prédiction sera ajouté à l'étape 2."
  );
}

loadBtn.addEventListener("click", loadMatches);
loadMatches();
</script>

</body>
</html>
