<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GK PRONO</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#07111f;
    color:white;
}

header{
    padding:22px 15px;
    text-align:center;
    background:linear-gradient(135deg,#07111f,#10294a);
    border-bottom:1px solid #1e3a5f;
}

.logo{
    font-size:30px;
    font-weight:bold;
}

.subtitle{
    margin-top:7px;
    color:#9fb5cf;
    font-size:14px;
}

.container{
    width:94%;
    max-width:900px;
    margin:20px auto;
}

/* COUPON */

.coupon{
    background:linear-gradient(135deg,#102b4d,#0b1b31);
    border:1px solid #28527d;
    border-radius:18px;
    padding:20px;
    margin-bottom:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.coupon h2{
    margin-top:0;
    color:#ffd54a;
}

.coupon-status{
    color:#9fb5cf;
    font-size:14px;
    margin-bottom:15px;
}

.coupon-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.coupon-item{
    background:#07111f;
    border-radius:12px;
    padding:13px;
    border:1px solid #1d3b5b;
}

.coupon-item strong{
    color:#fff;
}

.coupon-item span{
    display:block;
    margin-top:5px;
    color:#7ee787;
    font-weight:bold;
}

/* MATCHS */

.section-title{
    font-size:22px;
    margin-bottom:15px;
}

#matches{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.match{
    background:#0c1c30;
    border:1px solid #1d3856;
    border-radius:17px;
    padding:18px;
}

.match-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.league{
    color:#8fb4d8;
    font-size:13px;
}

.time{
    color:#ffd54a;
    font-weight:bold;
}

.teams{
    text-align:center;
    font-size:19px;
    font-weight:bold;
    line-height:1.6;
}

.vs{
    color:#6f88a4;
    font-size:13px;
}

.analyse{
    width:100%;
    margin-top:16px;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#1769e0;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.analyse:hover{
    background:#2480ff;
}

.message{
    text-align:center;
    padding:25px;
    color:#9fb5cf;
}

.error{
    color:#ff6b6b;
}

.footer{
    text-align:center;
    color:#607994;
    font-size:12px;
    padding:30px 10px;
}
</style>
</head>

<body>

<header>

    <div class="logo">⚡ GK PRONO</div>

    <div class="subtitle">
        Analyse intelligente des matchs ⚽
    </div>

</header>


<div class="container">

    <!-- COUPON DU JOUR -->

    <div class="coupon">

        <h2>🎯 COUPON RECOMMANDÉ DU JOUR</h2>

        <div class="coupon-status">
            Sélection basée uniquement sur les matchs disponibles.
        </div>

        <div id="couponList" class="coupon-list">

            <div class="message">
                🔄 Préparation du coupon...
            </div>

        </div>

    </div>


    <!-- MATCHS -->

    <div class="section-title">
        ⚽ MATCHS DU JOUR
    </div>

    <div id="matches">

        <div class="message">
            🔄 Chargement des matchs...
        </div>

    </div>

</div>


<div class="footer">
    GK PRONO © 2026<br>
    Pronostics indicatifs — aucune garantie de résultat.
</div>


<script>

async function chargerMatchs(){

    const matchesContainer =
        document.getElementById("matches");

    const couponContainer =
        document.getElementById("couponList");

    try{

        const response =
            await fetch("/api/matches");

        const data =
            await response.json();

        if(!response.ok || !data.success){

            throw new Error(
                data.message || "Erreur Sportmonks"
            );

        }

        const matches =
            data.matches || [];

        if(matches.length === 0){

            matchesContainer.innerHTML = `
                <div class="message">
                    Aucun match disponible aujourd'hui.
                </div>
            `;

            couponContainer.innerHTML = `
                <div class="message">
                    Aucun match disponible pour créer le coupon.
                </div>
            `;

            return;
        }


        // =========================
        // AFFICHAGE DES MATCHS
        // =========================

        matchesContainer.innerHTML = "";

        matches.forEach(match => {

            const nom =
                match.name || "Match";

            const date =
                match.starting_at || "";

            let heure = "";

            if(date.includes(" ")){

                heure =
                    date.split(" ")[1].substring(0,5);

            }

            const carte =
                document.createElement("div");

            carte.className = "match";

            carte.innerHTML = `

                <div class="match-top">

                    <div class="league">
                        ⚽ Football
                    </div>

                    <div class="time">
                        ${heure || "--:--"}
                    </div>

                </div>

                <div class="teams">
                    ${nom}
                </div>

                <button
                    class="analyse"
                    onclick="analyser(${match.id})">

                    🤖 ANALYSER

                </button>

            `;

            matchesContainer.appendChild(carte);

        });


        // =========================
        // COUPON DU JOUR
        // =========================

        creerCoupon(matches);


    }catch(error){

        console.error(error);

        matchesContainer.innerHTML = `
            <div class="message error">
                ❌ Impossible de récupérer les matchs.
                <br><br>
                ${error.message}
            </div>
        `;

        couponContainer.innerHTML = `
            <div class="message error">
                ❌ Impossible de préparer le coupon.
            </div>
        `;

    }

}


// =========================
// COUPON
// =========================

function creerCoupon(matches){

    const coupon =
        document.getElementById("couponList");

    /*
      IMPORTANT :
      Pour l'instant nous n'inventons
      aucune prédiction.

      Nous affichons les matchs disponibles
      comme candidats.

      La vraie sélection intelligente sera
      branchée à l'étape suivante.
    */

    const selection =
        matches.slice(0,3);

    coupon.innerHTML = "";

    selection.forEach((match,index) => {

        const item =
            document.createElement("div");

        item.className =
            "coupon-item";

        item.innerHTML = `

            <strong>
                ${index + 1}. ${match.name || "Match"}
            </strong>

            <span>
                🔎 Analyse à effectuer
            </span>

        `;

        coupon.appendChild(item);

    });

}


// =========================
// ANALYSE
// =========================

async function analyser(id){

    try {

        const bouton = event.target;

        bouton.disabled = true;
        bouton.innerText = "🔄 ANALYSE...";

        const response =
            await fetch("/api/analyse/" + id);

        const data =
            await response.json();

        if(!response.ok || !data.success){

            throw new Error(
                data.message || "Erreur pendant l'analyse"
            );

        }

        const match = data.match;

        alert(
            "🤖 ANALYSE GK PRONO\n\n" +
            "⚽ " + (match.name || "Match") + "\n\n" +
            "✅ Données du match récupérées.\n\n" +
            "La prochaine étape sera de calculer les pronostics."
        );

        bouton.disabled = false;
        bouton.innerText = "🤖 ANALYSER";

    } catch(error) {

        alert(
            "❌ Erreur d'analyse\n\n" +
            error.message
        );

        if(event && event.target){
            event.target.disabled = false;
            event.target.innerText = "🤖 ANALYSER";
        }

    }

    }
